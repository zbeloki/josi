[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "josi"
version = "0.7.0"
description = "Lightweight CLI for orchestrating AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
josi = "josi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
