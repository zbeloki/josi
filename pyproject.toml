[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "actl"
version = "0.2.0"
description = "Lightweight CLI for orchestrating AI coding agents through OpenCode"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
actl = "actl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
